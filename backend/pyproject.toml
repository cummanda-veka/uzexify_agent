[project]
name = "uzexify"
version = "0.1.0"
description = "UZEX deals Q&A agent"
requires-python = ">=3.14,<3.15"
dependencies = [
    "pydantic-ai-slim[openai]==2.66.0",
    "fastapi==0.162.0",
    "uvicorn[standard]==0.54.0",
    "sse-starlette==3.6.0",
    "psycopg[binary,pool]==3.3.8",
    "pgvector==0.5.1",
    "sqlglot==30.29.0",
    "pydantic-settings==2.16.2",
    "aiogram==3.31.0",
    "langfuse==5.1.0",
    "httpx",
    "vl-convert-python>=1.9.0.post1",
    "maxminddb>=3.2.0",
]

[project.scripts]
uzexify = "uzexify.cli:main"

[dependency-groups]
dev = [
    "pydantic-evals==2.66.0",
    "pytest",
    "pytest-asyncio",
    "ruff",
    "ty",
    "pyyaml",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/uzexify"]

[tool.ruff]
line-length = 110

[tool.ruff.lint.per-file-ignores]
"evals/*" = ["BLE001"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

asyncio_default_fixture_loop_scope = "function"
