    question: 2026-yil 29-oktabrda «Оплачен» holatidagi nechta bitim tuzilgan?
    expect_kind: answer
    reference_sql: "SELECT count(*) AS total FROM deals WHERE deal_date = '2026-10-29' AND status = 'Оплачен'"
    checks: [{column: total, match: number}]
  - id: status_cancelled
    lang: ru
    question: Сколько сделок от 3 января 2022 года имеют статус «Аннулирован(Не оплачен)»?
    expect_kind: answer
    reference_sql: "SELECT count(*) AS total FROM deals WHERE deal_date = '2022-01-03' AND status = 'Аннулирован(Не оплачен)'"
    checks: [{column: total, match: number}]
  - id: export_100024
    lang: uz_latn
    question: 100024-raqamli eksport bitimi summasini bitim kunidagi kurs bo‘yicha so‘mga aylantiring. Kurs va natija qancha?
    expect_kind: answer
    reference_sql: "SELECT usd_rate, amount_uzs FROM v_deals WHERE deal_no = 100024"
    checks: [{column: usd_rate, match: number}, {column: amount_uzs, match: number}]
  - id: export_100025
    lang: uz_cyrl
    question: 100025-рақамли экспорт битими суммасини битим кунидаги курс бўйича сўмга айлантиринг. Курс ва натижа қанча?
    expect_kind: answer
    reference_sql: "SELECT usd_rate, amount_uzs FROM v_deals WHERE deal_no = 100025"
    checks: [{column: usd_rate, match: number}, {column: amount_uzs, match: number}]
  - id: region_100001
    lang: uz_latn
    question: 100001-raqamli bitim bo‘yicha sotuvchi ombori qaysi hududda?
    expect_kind: answer
    reference_sql: "SELECT region_uz FROM v_deals WHERE deal_no = 100001"
    checks: [{column: region_uz, match: text}]
  - id: region_100003
    lang: ru
    question: В каком регионе находится склад продавца по сделке 100003?
    expect_kind: answer
    reference_sql: "SELECT region_ru FROM v_deals WHERE deal_no = 100003"
    checks: [{column: region_ru, match: text_ru}]
  - id: relative_previous_month
    lang: uz_latn
    question: Bugun 2026-yil 5-noyabr deb hisoblang. O‘tgan kalendar oyda, barcha holatlarni qo‘shib, nechta bitim tuzilgan?
    expect_kind: answer
    reference_sql: "SELECT count(*) AS total FROM deals WHERE deal_date >= '2026-10-01' AND deal_date < '2026-11-01'"
    checks: [{column: total, match: number}]
  - id: relative_previous_year
    lang: uz_latn
    question: Bugun 2026-yil 5-noyabr deb hisoblang. O‘tgan kalendar yilda barcha holatlardagi bitimlar soni qancha?
    expect_kind: answer
    reference_sql: "SELECT count(*) AS total FROM deals WHERE deal_date >= '2025-01-01' AND deal_date < '2026-01-01'"
    checks: [{column: total, match: number}]
  - id: clarify_price
    lang: ru
    question: Сколько сделок у компании RUKU?
    expect_kind: clarify
    reference_sql: "SELECT inn, name FROM participants WHERE name ILIKE '%RUKU%' ORDER BY name"
    checks: []
  - id: clarify_company
    lang: uz_latn
    question: SHIQO kompaniyasining bitimlari nechta?
    expect_kind: clarify
    reference_sql: "SELECT inn, name FROM participants WHERE name ILIKE '%SHIQO%' ORDER BY name"
    checks: []
  - id: no_2021
    lang: uz_latn
    question: 2021-yildagi bitimlar ro‘yxatini ko‘rsating.
    expect_kind: no_data
    reference_sql: "SELECT deal_no FROM deals WHERE deal_date >= '2021-01-01' AND deal_date < '2022-01-01' LIMIT 1"
    checks: []
  - id: no_2027
    lang: uz_cyrl
    question: 2027 йилдаги битимлар рўйхатини кўрсатинг.
    expect_kind: no_data
    reference_sql: "SELECT deal_no FROM deals WHERE deal_date >= '2027-01-01' AND deal_date < '2028-01-01' LIMIT 1"
    checks: []
  - id: no_company
    lang: uz_latn
    question: STIR 000000000 bo‘lgan kompaniya haqida reyestrda qanday ma’lumot bor?
    expect_kind: no_data
    reference_sql: "SELECT inn FROM participants WHERE inn = '000000000'"
    checks: []
  - id: no_director
    lang: ru
    question: Как зовут директора компании с ИНН 921912462 и каков его телефон?
    expect_kind: no_data
    reference_sql: "SELECT column_name FROM information_schema.columns WHERE table_schema = 'public' AND table_name = 'participants' AND column_name IN ('director', 'phone')"
    checks: []
  - id: no_gold
    lang: uz_latn
    question: Oltin bo‘yicha bitimlar bormi? Oltin rangli boshqa tovarlarni hisoblamang.
    expect_kind: no_data
    reference_sql: "SELECT product FROM products WHERE product ILIKE '%золото%' OR product ILIKE '%золотой слиток%' LIMIT 1"
    checks: []
  - id: no_eur_rate
    lang: uz_latn
    question: 2022-yil 3-yanvarda yevroning so‘mga nisbatan kursi qancha edi?
    expect_kind: no_data
    reference_sql: "SELECT table_name FROM information_schema.tables WHERE table_schema = 'public' AND table_name = 'eur_rates'"
    checks: []
  - id: chart_monthly_2025
    lang: ru
    question: Как менялось число сделок по месяцам в 2025 году? Покажи на графике.
    expect_kind: answer
    expect_chart: true
    reference_sql: "SELECT count(*) AS total FROM deals WHERE deal_date >= '2025-01-01' AND deal_date < '2026-01-01' GROUP BY date_trunc('month', deal_date) ORDER BY total DESC LIMIT 1"
    checks: [{column: total, match: number}]
  - id: chart_top_cement
    lang: ru
    question: Топ-5 покупателей цемента по объёму за всё время — покажи графиком.
    expect_kind: answer
    expect_chart: true
    reference_sql: "SELECT buyer_name FROM v_deals WHERE product_name ILIKE '%цемент%' GROUP BY buyer_inn, buyer_name ORDER BY sum(volume) DESC LIMIT 1"
    checks: [{column: buyer_name, match: text}]
  - id: chart_export_years
    lang: uz_latn
    question: Eksport bitimlari summasi yillar bo‘yicha dollarda qanday o‘zgargan? Grafikda ko‘rsating.
    expect_kind: answer
    expect_chart: true
    reference_sql: "SELECT extract(year FROM deal_date) AS year FROM v_deals WHERE contract_type = 'Экспортный' GROUP BY 1 LIMIT 1"
    checks: []
  - id: chart_usd_rate
    lang: uz_cyrl
    question: 2022–2026 йилларда доллар курси қандай ўзгарган? График билан кўрсатинг.
    expect_kind: answer
    expect_chart: true
    reference_sql: "SELECT count(*) AS days FROM usd_rates"
    checks: []
