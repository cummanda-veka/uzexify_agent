x-backend-env: &backend-env
  env_file: .env
  environment:
    DATABASE_URL: postgresql://uzex:${POSTGRES_PASSWORD}@db:5432/uzex
    AGENT_DATABASE_URL: postgresql://uzex_agent:${AGENT_DB_PASSWORD}@db:5432/uzex
    API_BASE_URL: http://api:8000
    CORS_ORIGINS: https://${PUBLIC_HOST}

services:
  db:
    image: pgvector/pgvector:0.8.7-pg18-trixie
    environment:
      POSTGRES_DB: uzex
      POSTGRES_USER: uzex
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U uzex -d uzex"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  api:
    profiles: [app]
    build: ./backend
    image: ghcr.io/cummanda-veka/uzexify-backend:latest
    <<: *backend-env
    volumes:
      - ./data/uzex_spot_data:/data:ro
      - ./geo:/geo:ro
    depends_on:
      db:
        condition: service_healthy
    networks:
      default:
      edge:
        aliases: [uzexify-api]
    restart: unless-stopped

  bot:
    profiles: [bot]
    image: ghcr.io/cummanda-veka/uzexify-backend:latest
    <<: *backend-env
    command: ["uzexify", "bot"]
    depends_on: [api]
    restart: unless-stopped

  web:
    profiles: [app]
    build:
      context: ./web
      args:
        NEXT_PUBLIC_API_BASE: ""
    image: ghcr.io/cummanda-veka/uzexify-web:latest
    networks:
      default:
      edge:
        aliases: [uzexify-web]
    restart: unless-stopped

# HTTPS comes from the host's shared edge Caddy (/opt/edge on the server); see uzexify.caddy.
networks:
  edge:
    external: true

volumes:
  pgdata:
