<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <style>
      html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: #07080d; }
    @font-face { font-family: "Geist"; font-weight: 400; src: url(assets/fonts/geist-400-latin.woff2) format("woff2"); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
    @font-face { font-family: "Geist"; font-weight: 400; src: url(assets/fonts/geist-400-latin-ext.woff2) format("woff2"); unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+1E00-1E9F, U+20A0-20AB, U+20AD-20C4, U+2C60-2C7F, U+A720-A7FF; }
    @font-face { font-family: "Geist"; font-weight: 400; src: url(assets/fonts/geist-400-cyrillic.woff2) format("woff2"); unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116; }
    @font-face { font-family: "Geist"; font-weight: 400; src: url(assets/fonts/geist-400-cyrillic-ext.woff2) format("woff2"); unicode-range: U+0460-052F, U+1C80-1C8A, U+20B4, U+2DE0-2DFF, U+A640-A69F, U+FE2E-FE2F; }
    @font-face { font-family: "Geist"; font-weight: 600; src: url(assets/fonts/geist-600-latin.woff2) format("woff2"); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
    @font-face { font-family: "Geist"; font-weight: 600; src: url(assets/fonts/geist-600-cyrillic.woff2) format("woff2"); unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116; }
    .scene {
      position: absolute;
      inset: 0;
      overflow: hidden;
      background: #07080d;
      font-family: "Geist", sans-serif;
      color: #eef1f8;
    }
    .win-glow {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(48% 60% at 18% 78%, rgba(47, 99, 231, 0.40), transparent 70%),
        radial-gradient(26% 34% at 20% 98%, rgba(255, 153, 30, 0.22), transparent 70%),
        radial-gradient(50% 50% at 92% 4%, rgba(127, 178, 255, 0.12), transparent 70%);
    }
    .win-grid {
      position: absolute;
      inset: 0;
      background-image: radial-gradient(rgba(255, 255, 255, 0.07) 1.2px, transparent 1.4px);
      background-size: 22px 22px;
      mask-image: linear-gradient(180deg, rgba(0, 0, 0, 0.15), rgba(0, 0, 0, 0.8));
    }
    .win {
      position: absolute;
      left: 210px;
      top: 54px;
      width: 1500px;
      border-radius: 14px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.12);
      background: #0b0d14;
      box-shadow: 0 40px 120px rgba(0, 0, 0, 0.65), 0 0 0 1px rgba(0, 0, 0, 0.4);
    }
    .win-bar {
      height: 40px;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 16px;
      background: #11141d;
      border-bottom: 1px solid rgba(255, 255, 255, 0.07);
    }
    .win-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.16);
    }
    .win-url {
      margin: 0 auto;
      padding: 5px 18px;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.06);
      color: #b9c0d0;
      font-size: 15px;
      letter-spacing: 0.01em;
    }
    .win-shot {
      display: block;
      width: 1500px;
      height: 937px;
      object-fit: cover;
      object-position: top center;
    }
    </style>
  </head>
  <body>
    <!-- README stills: one 1 s scene per picture, real screenshots of the web chat in a browser frame.
         Render with: npx hyperframes snapshot --at 0.5,1.5,2.5,3.5,4.5 --no-end -o <dir> -->
    <div id="root" data-composition-id="main" data-start="0" data-duration="5" data-width="1920" data-height="1080" data-no-timeline>
      <div id="hero" class="clip scene" data-start="0" data-duration="1" data-track-index="1">
        <div class="win-glow"></div>
        <div class="win-grid"></div>
        <div class="win">
          <div class="win-bar">
            <span class="win-dot"></span><span class="win-dot"></span><span class="win-dot"></span>
            <span class="win-url" data-layout-ignore>uzex.d3d.uz</span>
          </div>
          <img class="win-shot" src="assets/shots/answer.jpg" alt="" />
        </div>
      </div>
      <div id="steps" class="clip scene" data-start="1" data-duration="1" data-track-index="1">
        <div class="win-glow"></div>
        <div class="win-grid"></div>
        <div class="win">
          <div class="win-bar">
            <span class="win-dot"></span><span class="win-dot"></span><span class="win-dot"></span>
            <span class="win-url" data-layout-ignore>uzex.d3d.uz</span>
          </div>
          <img class="win-shot" src="assets/shots/steps.jpg" alt="" />
        </div>
      </div>
      <div id="evidence" class="clip scene" data-start="2" data-duration="1" data-track-index="1">
        <div class="win-glow"></div>
        <div class="win-grid"></div>
        <div class="win">
          <div class="win-bar">
            <span class="win-dot"></span><span class="win-dot"></span><span class="win-dot"></span>
            <span class="win-url" data-layout-ignore>uzex.d3d.uz</span>
          </div>
          <img class="win-shot" src="assets/shots/evidence.jpg" alt="" />
        </div>
      </div>
      <div id="uzbek" class="clip scene" data-start="3" data-duration="1" data-track-index="1">
        <div class="win-glow"></div>
        <div class="win-grid"></div>
        <div class="win">
          <div class="win-bar">
            <span class="win-dot"></span><span class="win-dot"></span><span class="win-dot"></span>
            <span class="win-url" data-layout-ignore>uzex.d3d.uz</span>
          </div>
          <img class="win-shot" src="assets/shots/uzbek.jpg" alt="" />
        </div>
      </div>
      <div id="clarify" class="clip scene" data-start="4" data-duration="1" data-track-index="1">
        <div class="win-glow"></div>
        <div class="win-grid"></div>
        <div class="win">
          <div class="win-bar">
            <span class="win-dot"></span><span class="win-dot"></span><span class="win-dot"></span>
            <span class="win-url" data-layout-ignore>uzex.d3d.uz</span>
          </div>
          <img class="win-shot" src="assets/shots/clarify.jpg" alt="" />
        </div>
      </div>
    </div>
  </body>
</html>
